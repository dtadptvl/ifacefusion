name: iFaceFusion
options:
  bundleIdPrefix: com.dtadptvl
  deploymentTarget:
    iOS: "18.0"
packages:
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.24.2
targets:
  iFaceFusion:
    type: application
    platform: iOS
    sources:
      - path: iFaceFusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dtadptvl.ifacefusion
        PRODUCT_NAME: iFaceFusion
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: iFaceFusion
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select a source and target portrait to process entirely on this device.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save completed iFaceFusion images to your photo library.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: OnnxRuntime
        product: onnxruntime
