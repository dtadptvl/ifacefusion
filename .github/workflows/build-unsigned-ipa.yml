name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ifacefusion-ios-build-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate app icon
        run: python3 scripts/generate_icon.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -project iFaceFusion.xcodeproj -scheme iFaceFusion -resolvePackageDependencies
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project iFaceFusion.xcodeproj -scheme iFaceFusion -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/iFaceFusion.app Payload/
          /usr/bin/zip -qry iFaceFusion-unsigned.ipa Payload
          /usr/bin/codesign -dv Payload/iFaceFusion.app 2>codesign.txt || true
          ! grep -q "Authority=" codesign.txt
          test -s iFaceFusion-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iFaceFusion-unsigned
          path: |
            iFaceFusion-unsigned.ipa
            build.log
